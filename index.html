<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My App - Download</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b12;
      color: white;
      min-height: 100vh;
    }

    .container {
      width: min(1100px, 92%);
      margin: auto;
    }

    /* Header */
    header {
      padding: 30px 0 20px;
      text-align: center;
    }

    .logo {
      width: 80px;
      height: 80px;
      border-radius: 22px;
      object-fit: cover;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aaa;
      font-size: 17px;
      margin-bottom: 25px;
    }

    /* Download Button */
    .download-btn {
      display: inline-block;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      color: white;
      text-decoration: none;
      padding: 18px 42px;
      border-radius: 14px;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 10px 30px rgba(37, 99, 235, 0.3);
      transition: 0.25s;
    }

    .download-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(124, 58, 237, 0.4);
    }

    .download-info {
      margin-top: 12px;
      color: #888;
      font-size: 13px;
    }

    /* Rating */
    .rating {
      margin: 35px auto;
      padding: 20px;
      background: #151520;
      border: 1px solid #252538;
      border-radius: 18px;
      max-width: 420px;
    }

    .stars {
      color: #ffc107;
      font-size: 27px;
      letter-spacing: 3px;
    }

    .rating-number {
      font-size: 28px;
      font-weight: bold;
      margin-top: 5px;
    }

    .reviews {
      color: #888;
      margin-top: 5px;
    }
